name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Nim (JS backend)
        run: |
          curl -sL https://nim-lang.org/download/nim-2.2.4-linux_x64.tar.xz -o nim.tar.xz
          sudo mkdir -p /opt/nimtoolchain && sudo tar xf nim.tar.xz -C /opt/nimtoolchain
          echo "/opt/nimtoolchain/nim-2.2.4/bin" >> "$GITHUB_PATH"
      - name: Build engine from Nim source
        run: npm run build:engine
      - name: Run tests before publishing (real Nim bundle)
        run: node --test tests/*.test.mjs
      - name: Stamp service worker with deploy SHA
        run: sed -i "s/__NN_CACHE_VERSION__/nn-${GITHUB_SHA::7}/" sw.js && grep -o "CACHE_VERSION = 'nn-[a-f0-9]*'" sw.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
